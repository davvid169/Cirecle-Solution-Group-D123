name: circle-solution-project
services:
    webdev-project-webserver:
        build: ./webserver
        networks:
            - webdevproject
        environment:
            - PHP_IDE_CONFIG=serverName=localhost
        volumes:
            - ./src:/var/www/project
        ports:
            - "80:80"
        extra_hosts:
            - "host.docker.internal:host-gateway"

networks:
    webdevproject:
        driver: bridge
